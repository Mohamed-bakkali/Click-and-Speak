global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "tns_app"
    scrape_interval: 5s
    static_configs:
      - targets: ["app:80"]

  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "n8n"
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:5678"]
    metrics_path: /metrics
    params:
      format: ['prometheus']
