  <style>
    * {
      box-sizing: border-box;

    html,

      margin: 0;

    body {
      display: flex;

      min-height: 100vh;

    video {
      display: block;
      width: 100%;

      margin: 0 auto;
      background: #000;
      border-radius: 10px;
    }
